<body data-page="contact">
<a class="skip" href="#main">Skip to content</a>
<header id="site-header"></header>
<main id="main">

<header class="page-head"><div class="wrap" style="max-width:860px">
  <p class="eyebrow">Say hi</p>
  <h1>Contact</h1>
  <p class="lede">Got an idea, a question, or a ride you want to build? Write to us here, or email <a href="mailto:mikeyexperiences@gmail.com">mikeyexperiences@gmail.com</a>.</p>
</div></header>
<section class="section" style="padding-top:12px"><div class="wrap" style="max-width:860px">
  <div class="form-panel" id="contact-panel">
    <form class="form" id="contact-form" name="contact" method="POST" data-netlify="true" netlify-honeypot="bot-field" novalidate>
      <input type="hidden" name="form-name" value="contact">
      <p class="hp"><label>Leave this empty <input name="bot-field" tabindex="-1" autocomplete="off"></label></p>
      <div class="form-row">
        <div class="field"><label for="c-name">Name</label><input class="input" id="c-name" name="name" required autocomplete="name"></div>
        <div class="field"><label for="c-email">Email</label><input class="input" id="c-email" name="email" type="email" required autocomplete="email"></div>
      </div>
      <div class="field"><label for="c-topic">Topic</label><select class="select" id="c-topic" name="topic">
        <option>General</option><option>Host a ride</option><option>Press</option><option>Partner or sponsor</option><option>Volunteer</option><option>Other</option></select></div>
      <div class="field"><label for="c-msg">Message</label><textarea class="textarea" id="c-msg" name="message" required rows="6"></textarea></div>
      <p class="form-status" id="contact-status" role="alert"></p>
      <div><button class="btn btn--big" type="submit">Send it</button></div>
    </form>
  </div>
  <p class="muted" style="margin-top:28px">Looking for answers? Try the <a href='/faq'>FAQ</a>.</p>
</div></section>
</main>
