    <style>html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }</style>
    <!-- JoyCon site edits: (1) the art scale fills landscape screens edge to edge instead of letterboxing, in assets/index-*.js.
         (2) when embedded on the homepage, the site nav carries the title card, so hide the island's copy -->
    <style>html.jc-embedded .jc-head { display: none !important; }</style>
    <style>/* nine ride cards: swipe the row instead of spilling off small screens */ .jc-bar{ justify-content: safe center !important; overflow-x: auto; scrollbar-width: none; -webkit-overflow-scrolling: touch; } .jc-bar::-webkit-scrollbar{ display: none; } .jc-bar > *{ flex-shrink: 0; }</style>
    <script>if (window.top !== window.self) document.documentElement.classList.add("jc-embedded");</script>
    <style>/* ride cards as lit arcade buttons: a dark bezel, a glossy glowing cap with the icon, and the chosen one pops up taller */
      .jc-bar .jc-slot{ --cap:#e2562c; --cap-deep:#9c3215; --glow:rgba(226,86,44,.55);
        width: clamp(64px, 10vh, 98px) !important; height: clamp(64px, 10vh, 98px) !important; padding: 7px !important;
        background: linear-gradient(160deg, #3b3a44, #1f1e25) !important; border: 2px solid #121116 !important; border-radius: 16px !important;
        box-shadow: inset 0 1px 0 rgba(255,255,255,.12), inset 0 -2px 4px rgba(0,0,0,.5), 0 4px 8px rgba(20,18,24,.35) !important;
        translate: none !important; transition: none !important; cursor: pointer; }
      .jc-bar .jc-slot:nth-child(5n+2){ --cap:#0588c4; --cap-deep:#034e72; --glow:rgba(5,136,196,.6); }
      .jc-bar .jc-slot:nth-child(5n+3){ --cap:#f79c09; --cap-deep:#a76402; --glow:rgba(247,156,9,.6); }
      .jc-bar .jc-slot:nth-child(5n+4){ --cap:#35a468; --cap-deep:#1d6a40; --glow:rgba(53,164,104,.6); }
      .jc-bar .jc-slot:nth-child(5n+5){ --cap:#e9809c; --cap-deep:#a2465f; --glow:rgba(233,128,156,.6); }
      .jc-bar .jc-slot-art{ position: relative; height: 100% !important; width: 100%; border-radius: 10px; overflow: visible;
        background: radial-gradient(70% 62% at 50% 42%, #fffaf0 0%, rgba(255,250,240,.92) 38%, var(--cap) 78%);
        box-shadow: 0 5px 0 var(--cap-deep), 0 0 0 2px rgba(0,0,0,.35), 0 0 14px var(--glow), inset 0 2px 3px rgba(255,255,255,.65), inset 0 -3px 6px rgba(0,0,0,.18);
        transform: translateY(-5px); transition: transform 140ms cubic-bezier(.3,1.5,.5,1), box-shadow 140ms; }
      .jc-bar .jc-slot-art::after{ content: ""; position: absolute; inset: 3px 5px auto; height: 32%; border-radius: 8px 8px 50% 50%;
        background: linear-gradient(rgba(255,255,255,.55), rgba(255,255,255,0)); pointer-events: none; }
      .jc-bar .jc-slot-art img{ position: relative; z-index: 1; width: 82% !important; height: 82% !important; filter: drop-shadow(0 1px 1px rgba(0,0,0,.25)); }
      .jc-bar .jc-slot:hover .jc-slot-art{ transform: translateY(-8px); box-shadow: 0 8px 0 var(--cap-deep), 0 0 0 2px rgba(0,0,0,.35), 0 0 20px var(--glow), inset 0 2px 3px rgba(255,255,255,.65), inset 0 -3px 6px rgba(0,0,0,.18); }
      .jc-bar .jc-slot:active .jc-slot-art{ transform: translateY(-1px); box-shadow: 0 1px 0 var(--cap-deep), 0 0 0 2px rgba(0,0,0,.35), 0 0 10px var(--glow), inset 0 2px 3px rgba(255,255,255,.5); }
      /* the selected ride: popped up taller and fully lit */
      .jc-bar .jc-slot.is-active{ background: linear-gradient(160deg, #3b3a44, #1f1e25) !important; }
      .jc-bar .jc-slot.is-active .jc-slot-art{ transform: translateY(-20px);
        box-shadow: 0 20px 0 var(--cap-deep), 0 0 0 2px rgba(0,0,0,.35), 0 0 30px 6px var(--glow), inset 0 2px 3px rgba(255,255,255,.75), inset 0 -3px 6px rgba(0,0,0,.12); }
      .jc-bar .jc-slot:focus-visible{ outline: 3px solid #fffaf0; outline-offset: 3px; }
      /* icon only: keep the name for screen readers */
      .jc-bar .jc-slot-name{ position: absolute !important; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; margin: 0; }
      .jc-bar{ padding-top: 24px !important; }
      /* clear plastic housing instead of the black bezel */
      .jc-bar .jc-slot, .jc-bar .jc-slot.is-active{
        background: linear-gradient(155deg, rgba(255,255,255,.62) 0%, rgba(255,255,255,.14) 42%, rgba(255,255,255,.08) 60%, rgba(255,255,255,.4) 100%) !important;
        border: 1.5px solid rgba(255,255,255,.85) !important;
        box-shadow: inset 0 1.5px 0 rgba(255,255,255,1), inset 0 -4px 8px rgba(110,120,140,.22), inset 2px 0 4px rgba(255,255,255,.35),
                    0 1px 0 rgba(120,120,130,.35), 0 10px 18px -6px rgba(42,36,32,.28) !important;
        -webkit-backdrop-filter: blur(5px) saturate(1.25); backdrop-filter: blur(5px) saturate(1.25); }
      .jc-bar .jc-slot::before{ content: ""; position: absolute; left: 10%; right: 38%; top: 5px; height: 26%; border-radius: 10px 10px 40% 40%; z-index: 2; pointer-events: none;
        background: linear-gradient(rgba(255,255,255,.7), rgba(255,255,255,0)); opacity: .55; }
      /* chunkier cap: a deep coloured side, a domed top and a contact shadow in the housing */
      .jc-bar .jc-slot-art{ border-radius: 12px;
        background: radial-gradient(70% 62% at 46% 38%, #fffaf0 0%, rgba(255,250,240,.9) 36%, var(--cap) 74%, var(--cap-deep) 100%);
        box-shadow: 0 9px 0 var(--cap-deep), 0 11px 0 rgba(0,0,0,.18), 0 16px 14px -4px rgba(0,0,0,.28), 0 0 16px var(--glow),
                    inset 0 3px 4px rgba(255,255,255,.8), inset 0 -5px 8px rgba(0,0,0,.2), inset 0 0 0 1.5px rgba(255,255,255,.35);
        transform: translateY(-9px); }
      .jc-bar .jc-slot:hover .jc-slot-art{ transform: translateY(-13px);
        box-shadow: 0 13px 0 var(--cap-deep), 0 15px 0 rgba(0,0,0,.18), 0 22px 16px -4px rgba(0,0,0,.26), 0 0 22px var(--glow),
                    inset 0 3px 4px rgba(255,255,255,.8), inset 0 -5px 8px rgba(0,0,0,.2), inset 0 0 0 1.5px rgba(255,255,255,.35); }
      .jc-bar .jc-slot:active .jc-slot-art{ transform: translateY(-2px);
        box-shadow: 0 2px 0 var(--cap-deep), 0 3px 0 rgba(0,0,0,.18), 0 5px 6px rgba(0,0,0,.2), 0 0 10px var(--glow), inset 0 3px 4px rgba(255,255,255,.6), inset 0 -3px 6px rgba(0,0,0,.18); }
      .jc-bar .jc-slot.is-active .jc-slot-art{ transform: translateY(-28px);
        box-shadow: 0 28px 0 var(--cap-deep), 0 30px 0 rgba(0,0,0,.18), 0 38px 18px -4px rgba(0,0,0,.25), 0 0 34px 8px var(--glow),
                    inset 0 3px 4px rgba(255,255,255,.9), inset 0 -5px 8px rgba(0,0,0,.14), inset 0 0 0 1.5px rgba(255,255,255,.45); }
      .jc-bar{ padding-top: 34px !important; }
      /* buttons only: no housing, no soft shadows; a solid stepped side makes each cap a chunky 3D block */
      .jc-bar{ gap: clamp(14px, 1.8vw, 26px) !important; padding: 42px 16px 18px !important; }
      .jc-bar .jc-slot, .jc-bar .jc-slot.is-active{ background: none !important; border: 0 !important; box-shadow: none !important;
        -webkit-backdrop-filter: none; backdrop-filter: none; padding: 0 !important; overflow: visible; }
      .jc-bar .jc-slot::before{ display: none; }
      .jc-bar .jc-slot-art{ border-radius: 14px;
        background: radial-gradient(75% 65% at 44% 36%, #fffdf6 0%, rgba(255,251,240,.92) 34%, var(--cap) 72%, var(--cap-deep) 100%);
        --side: 0 1px 0 var(--cap-deep), 0 2px 0 var(--cap-deep), 0 3px 0 var(--cap-deep), 0 4px 0 var(--cap-deep), 0 5px 0 var(--cap-deep),
                0 6px 0 var(--cap-deep), 0 7px 0 var(--cap-deep), 0 8px 0 var(--cap-deep), 0 9px 0 var(--cap-deep), 0 10px 0 var(--cap-deep),
                0 11px 0 var(--cap-deep), 0 12px 0 var(--cap-deep), 0 13px 0 rgba(0,0,0,.35);
        box-shadow: var(--side), inset 0 4px 3px rgba(255,255,255,.85), inset 0 -6px 0 rgba(0,0,0,.12), inset 4px 0 4px rgba(255,255,255,.3), inset -4px 0 6px rgba(0,0,0,.1) !important;
        transform: translateY(-12px); }
      .jc-bar .jc-slot-art::after{ inset: 4px 7px auto; height: 30%; opacity: .9; }
      .jc-bar .jc-slot:hover .jc-slot-art{ transform: translateY(-16px); }
      .jc-bar .jc-slot:active .jc-slot-art{ transform: translateY(-3px);
        box-shadow: 0 1px 0 var(--cap-deep), 0 2px 0 var(--cap-deep), 0 3px 0 var(--cap-deep), 0 4px 0 rgba(0,0,0,.35), inset 0 4px 3px rgba(255,255,255,.7), inset 0 -4px 0 rgba(0,0,0,.12) !important; }
      .jc-bar .jc-slot.is-active .jc-slot-art{ transform: translateY(-30px);
        box-shadow: 0 1px 0 var(--cap-deep), 0 2px 0 var(--cap-deep), 0 3px 0 var(--cap-deep), 0 4px 0 var(--cap-deep), 0 5px 0 var(--cap-deep), 0 6px 0 var(--cap-deep), 0 7px 0 var(--cap-deep), 0 8px 0 var(--cap-deep), 0 9px 0 var(--cap-deep), 0 10px 0 var(--cap-deep), 0 11px 0 var(--cap-deep), 0 12px 0 var(--cap-deep), 0 13px 0 var(--cap-deep), 0 14px 0 var(--cap-deep), 0 15px 0 var(--cap-deep), 0 16px 0 var(--cap-deep), 0 17px 0 var(--cap-deep), 0 18px 0 var(--cap-deep), 0 19px 0 var(--cap-deep), 0 20px 0 var(--cap-deep), 0 21px 0 var(--cap-deep), 0 22px 0 var(--cap-deep), 0 23px 0 var(--cap-deep), 0 24px 0 var(--cap-deep), 0 25px 0 var(--cap-deep), 0 26px 0 var(--cap-deep), 0 27px 0 var(--cap-deep), 0 28px 0 var(--cap-deep), 0 29px 0 var(--cap-deep), 0 30px 0 var(--cap-deep), 0 31px 0 rgba(0,0,0,.35), inset 0 4px 3px rgba(255,255,255,.9), inset 0 -6px 0 rgba(0,0,0,.1) !important; }
      @media (prefers-reduced-motion: reduce){ .jc-bar .jc-slot-art{ transition: none; } }
      /* the coaster is clickable: hovering the painted track or the cart glows the loop */
      /* the coaster gets the same sticker outline as every ride (the bundle's filter on .jc-art);
         it just must not shift, or the cut-out rails would slide off the painted ones */
      .jc-ride:has(.jc-track-hit) .jc-art{ transform: none !important; }
      .jc-track-hit{ stroke: transparent !important; }
    </style>
